name: build

on:
  push:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Restore keystore (optional)
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then echo "$KS" | base64 -d > android/release.jks; fi
      - name: Build
        env:
          KS_PASS: ${{ secrets.KS_PASS }}
          KS_ALIAS: ${{ secrets.KS_ALIAS }}
        run: gradle -p android assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: FindPhone-apk
          path: android/app/build/outputs/apk/release/*.apk

  pc:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyinstaller
      - run: pyinstaller --onefile --noconsole --name FindPhone pc/findphone_pc.py
      - uses: actions/upload-artifact@v4
        with:
          name: FindPhone-exe
          path: dist/FindPhone.exe
